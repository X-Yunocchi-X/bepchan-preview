name: Deploy Why Choose Beptard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore original screenshots
        run: |
          mkdir -p public/why-choose-beptard
          base64 --decode assets/kancolle-error.png.b64 > public/why-choose-beptard/kancolle-error.png
          base64 --decode assets/kancolle-continue.png.b64 > public/why-choose-beptard/kancolle-continue.png
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build original Codex page
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
